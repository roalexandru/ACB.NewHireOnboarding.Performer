name: Claude Job Failure Triage

# Investigates a failed Orchestrator job with the `uipath-troubleshoot` skill and
# files an issue with the diagnosis. It never touches source — remediation lives in
# claude-apply-fix.yml, dispatched against the issue this workflow opens.
#
# The split is not just tidiness. The troubleshoot skill refuses to edit source
# artifacts itself (applying a fix sits behind an interactive approval gate that does
# not exist on a runner), and separating the two means a fix can be retried, or run
# against an issue filed days ago, without paying for an 80-turn re-investigation.
#
# Every verdict files an issue, including CODE_FIX. The issue tracks the failure; a
# PR is only ever one proposed remedy, and closing it unmerged must not erase the
# record that the job failed.

on:
  workflow_dispatch:
    inputs:
      job_key:
        description: Orchestrator job key (GUID) of the faulted job
        required: true
        type: string
      folder_path:
        description: Orchestrator folder the job ran in
        required: true
        default: CodingAgentsDemos
        type: string
  # Push path. Orchestrator cannot POST here itself — /dispatches needs an
  # Authorization header and this exact body shape, and an Orchestrator webhook sends
  # its own payload with no custom headers. Something in between has to translate,
  # e.g. the dispatch-error-agent in the uipath-support-agent solution:
  #   gh api repos/{owner}/{repo}/dispatches -f event_type=job-failure \
  #     -F 'client_payload[job_key]=<guid>' -F 'client_payload[folder_path]=CodingAgentsDemos'
  # The caller needs its own GitHub credential (PAT or App installation token) only
  # because it runs outside Actions, where GITHUB_TOKEN does not exist —
  # repository_dispatch is itself one of the two events a GITHUB_TOKEN may raise.
  repository_dispatch:
    types: [job-failure]

  # Poll path — DISABLED for now. Needs no Orchestrator-side wiring at all: it asks
  # Orchestrator for failed jobs and triages the oldest one it has not already filed.
  # Re-enable by uncommenting the two lines below; nothing else depends on this being
  # off, and the poll logic itself is unchanged.
  # schedule:
  #   - cron: '*/30 * * * *'

# Scheduled runs all share one slot so a poll cannot pick up a job the previous poll
# is still triaging — its dedupe branch does not exist yet at that point.
concurrency:
  group: job-triage-${{ github.event.inputs.job_key || github.event.client_payload.job_key || 'scheduled' }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  resolve:
    name: Resolve job reference
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.select.outputs.found }}
      job_key: ${{ steps.select.outputs.job_key }}
      folder_path: ${{ steps.args.outputs.folder_path }}
      short_key: ${{ steps.select.outputs.short_key }}
      detection: ${{ steps.select.outputs.detection }}
      scope: ${{ steps.select.outputs.scope }}
      item_ref: ${{ steps.select.outputs.item_ref }}
      exception_type: ${{ steps.select.outputs.exception_type }}
    env:
      UIPATH_CLIENT_ID: ${{ secrets.UIPATH_CLIENT_ID }}
      UIPATH_CLIENT_SECRET: ${{ secrets.UIPATH_CLIENT_SECRET }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Gives the poll path an origin remote for its branch dedupe check.
      - name: Checkout
        uses: actions/checkout@v4

      # The three trigger shapes carry the same values in different places; the poll
      # path carries none and has to go ask Orchestrator.
      - name: Normalize trigger inputs
        id: args
        env:
          EVENT_NAME: ${{ github.event_name }}
          WD_JOB_KEY: ${{ inputs.job_key }}
          WD_FOLDER: ${{ inputs.folder_path }}
          RD_JOB_KEY: ${{ github.event.client_payload.job_key }}
          RD_FOLDER: ${{ github.event.client_payload.folder_path }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            repository_dispatch) JOB_KEY="$RD_JOB_KEY"; FOLDER="$RD_FOLDER" ;;
            schedule)            JOB_KEY=""; FOLDER="" ;;
            *)                   JOB_KEY="$WD_JOB_KEY"; FOLDER="$WD_FOLDER" ;;
          esac
          FOLDER="${FOLDER:-CodingAgentsDemos}"

          {
            echo "job_key=$JOB_KEY"
            echo "folder_path=$FOLDER"
          } >> "$GITHUB_OUTPUT"

      - name: Install UiPath CLI
        if: github.event_name == 'schedule'
        run: |
          npm install -g @uipath/cli
          uip --version

      - name: UiPath Cloud login
        if: github.event_name == 'schedule'
        run: uip login --client-id env.UIPATH_CLIENT_ID --client-secret env.UIPATH_CLIENT_SECRET --authority "https://staging.uipath.com" --tenant demo

      # A failure here wears one of three shapes, and no single query sees all three:
      #
      #  faulted-job        State=Faulted. Honest, but Data/Config.xlsx sets
      #                     ShouldMarkJobAsFaulted=False, so it effectively never fires.
      #  failed-transaction A queue item failed. THE common case: a defect in a C-step
      #                     blows up one transaction, REFramework catches it, marks the
      #                     item Failed, logs at *Error*, and the job ends Successful.
      #                     Measured: such a job carries 0 Fatal entries and 5 Error, so
      #                     any log-level scan misses it outright.
      #  job-fatal-log      Successful job carrying a Fatal entry. The job-level failure
      #                     that never reaches a transaction -- e.g. the queue itself is
      #                     missing, so no queue item exists to find.
      #
      # Candidates from the first two are merged and drained oldest-first, so a backlog
      # clears in the order it happened rather than by category. The Fatal scan runs
      # only if those come up empty, because it costs one API call per job.
      - name: Find an untriaged failure
        id: poll
        if: github.event_name == 'schedule'
        env:
          FOLDER: ${{ steps.args.outputs.folder_path }}
        run: |
          set -euo pipefail
          SINCE=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)

          # Every issue and PR this workflow opens carries the short job key in its
          # title, so searching those is what tells us a job was already handled.
          # Explicit ifs, not `[ ... ] && return 1` -- a trailing false test would make
          # the function return non-zero and silently mean the opposite.
          untriaged() {
            local short="${1%%-*}" n
            n=$(gh issue list --repo "$GH_REPO" --state all --search "$short in:title" --limit 1 --json number --jq 'length' 2>/dev/null || echo 0)
            if [ "${n:-0}" != "0" ]; then return 1; fi
            n=$(gh pr list --repo "$GH_REPO" --state all --search "$short in:title" --limit 1 --json number --jq 'length' 2>/dev/null || echo 0)
            if [ "${n:-0}" != "0" ]; then return 1; fi
            # Search indexing lags; a freshly pushed branch is the immediate signal.
            if git ls-remote --exit-code --heads origin "fix/job-$short-*" >/dev/null 2>&1; then return 1; fi
            return 0
          }

          claim() {  # ts, key, detection, ref, exception_type
            {
              echo "job_key=$2"
              echo "detection=$3"
              echo "item_ref=$4"
              echo "exception_type=$5"
            } >> "$GITHUB_OUTPUT"
            echo "::notice::Detected via $3 — job $2${4:+ (queue item $4${5:+, $5})}"
          }

          uip or jobs list --folder-path "$FOLDER" --state Faulted --ended-after "$SINCE" \
            --limit 20 --output json --output-filter '[].{Key:Key,EndTime:EndTime}' \
            > "$RUNNER_TEMP/faulted.json" 2>/dev/null || echo '{"Data":[]}' > "$RUNNER_TEMP/faulted.json"

          # No --ended-after on queue-items, so the window is applied in jq. ISO-8601
          # with a Z suffix compares correctly as a string.
          uip or queue-items list --folder-path "$FOLDER" --status Failed \
            --limit 50 --all-fields --output json \
            > "$RUNNER_TEMP/items.json" 2>/dev/null || echo '{"Data":[]}' > "$RUNNER_TEMP/items.json"

          UNWRAP='if type == "array" then . else (.Data // []) end'
          CAND="$RUNNER_TEMP/candidates.tsv"
          : > "$CAND"

          jq -r "$UNWRAP"' | sort_by(.EndTime) | .[]? | select((.Key // "") != "")
                | [.EndTime, .Key, "faulted-job", "", ""] | @tsv' \
             "$RUNNER_TEMP/faulted.json" >> "$CAND" 2>/dev/null || true

          # Reference and ProcessingExceptionType are upstream data, so they are
          # stripped to a display-safe charset here, at the point they enter the
          # pipeline. That closes shell injection and $GITHUB_OUTPUT line injection at
          # the source rather than at each of the places they are later printed. Real
          # values ("E7856-2026", "ApplicationException") pass through untouched.
          jq -r --arg since "$SINCE" "$UNWRAP"' | map(select((.EndProcessing // "") >= $since and (.ExecutorJobKey // "") != ""))
                | sort_by(.EndProcessing) | .[]?
                | [.EndProcessing, .ExecutorJobKey, "failed-transaction",
                   ((.Reference // "") | gsub("[^A-Za-z0-9 ._-]"; "") | .[0:60]),
                   ((.ProcessingExceptionType // "") | gsub("[^A-Za-z0-9 ._-]"; "") | .[0:40])] | @tsv' \
             "$RUNNER_TEMP/items.json" >> "$CAND" 2>/dev/null || true

          echo "Candidates from job + queue-item scans: $(wc -l < "$CAND")"

          while IFS=$'\t' read -r TS KEY DET REF EXC; do
            [ -n "${KEY:-}" ] || continue
            untriaged "$KEY" || continue
            claim "$TS" "$KEY" "$DET" "$REF" "$EXC"
            exit 0
          done < <(sort -k1,1 "$CAND")

          # Fallback: a job-level failure leaves no queue item, so only its log shows it.
          uip or jobs list --folder-path "$FOLDER" --state Successful --ended-after "$SINCE" \
            --limit 20 --output json --output-filter '[].{Key:Key,EndTime:EndTime}' \
            > "$RUNNER_TEMP/ok.json" 2>/dev/null || echo '{"Data":[]}' > "$RUNNER_TEMP/ok.json"

          for KEY in $(jq -r "$UNWRAP"' | sort_by(.EndTime) | .[]?.Key // empty' "$RUNNER_TEMP/ok.json" 2>/dev/null); do
            untriaged "$KEY" || continue
            uip or jobs logs "$KEY" --level Fatal --limit 1 --output json \
              --output-filter '[].{Level:Level}' 2>/dev/null | grep -q '"Level"' || continue
            claim "" "$KEY" "job-fatal-log" "" ""
            exit 0
          done

          echo "job_key=" >> "$GITHUB_OUTPUT"
          echo "No untriaged failure in $FOLDER in the last 24h."

      # One GUID check for all three paths — it is also the sanitation gate before any
      # of this reaches a shell or a branch name.
      - name: Select job
        id: select
        env:
          ARG_JOB_KEY: ${{ steps.args.outputs.job_key }}
          POLL_JOB_KEY: ${{ steps.poll.outputs.job_key }}
          POLL_DETECTION: ${{ steps.poll.outputs.detection }}
          ITEM_REF: ${{ steps.poll.outputs.item_ref }}
          EXC_TYPE: ${{ steps.poll.outputs.exception_type }}
          EVENT_NAME: ${{ github.event_name }}
          FOLDER: ${{ steps.args.outputs.folder_path }}
        run: |
          set -euo pipefail
          JOB_KEY="${ARG_JOB_KEY:-$POLL_JOB_KEY}"

          if [ -z "$JOB_KEY" ]; then
            if [ "$EVENT_NAME" = "schedule" ]; then
              echo "found=false" >> "$GITHUB_OUTPUT"
              echo "Nothing to triage."
              {
                echo "### Job Failure Triage"
                echo
                echo "Polled \`$FOLDER\` — no untriaged failure in the last 24h."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error::No job_key supplied."
            exit 1
          fi

          if ! printf '%s' "$JOB_KEY" | grep -qiE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            echo "::error::job_key must be an Orchestrator job key GUID; got '$JOB_KEY'"
            exit 1
          fi

          case "$EVENT_NAME" in
            schedule)            DETECTION="poll:${POLL_DETECTION:-unknown}" ;;
            repository_dispatch) DETECTION="external-dispatch" ;;
            *)                   DETECTION="manual-dispatch" ;;
          esac

          # failed-transaction is the only path that knows a queue item, so the shape of
          # the failure is legible from the detection value alone.
          case "$DETECTION" in
            poll:failed-transaction) SCOPE="transaction" ;;
            poll:faulted-job|poll:job-fatal-log) SCOPE="job" ;;
            *) SCOPE="unknown" ;;
          esac

          {
            echo "found=true"
            echo "job_key=$JOB_KEY"
            echo "short_key=${JOB_KEY%%-*}"
            echo "detection=$DETECTION"
            echo "scope=$SCOPE"
            echo "item_ref=$ITEM_REF"
            echo "exception_type=$EXC_TYPE"
          } >> "$GITHUB_OUTPUT"

          echo "::notice::Triaging job $JOB_KEY (detected via $DETECTION, scope $SCOPE)"
          {
            echo "### Job Failure Triage"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Detected via | \`$DETECTION\` |"
            echo "| Failure scope | $SCOPE |"
            echo "| Job | \`$JOB_KEY\` |"
            echo "| Folder | \`$FOLDER\` |"
            [ -n "$ITEM_REF" ] && echo "| Queue item | \`$ITEM_REF\` |"
            [ -n "$EXC_TYPE" ] && echo "| Exception type | $EXC_TYPE |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

  investigate:
    # Detection path in the job name, so the Actions run list shows which signal fired
    # without anyone opening a log.
    name: Investigate ${{ needs.resolve.outputs.scope }} failure (${{ needs.resolve.outputs.detection }})
    needs: resolve
    if: needs.resolve.outputs.found == 'true'
    runs-on: ubuntu-latest
    # A playbook walk with escalation can run long; the 80-turn cap is the real limit.
    timeout-minutes: 45
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
    env:
      UIPATH_CLIENT_ID: ${{ secrets.UIPATH_CLIENT_ID }}
      UIPATH_CLIENT_SECRET: ${{ secrets.UIPATH_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The troubleshoot skill reads workflow source as evidence, and uip rpa needs
      # the .NET SDK if the investigation ends up validating a file.
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # https://docs.uipath.com/coding-agents/standalone/latest/user-guide/install-and-set-up
      - name: Install UiPath CLI
        run: |
          npm install -g @uipath/cli
          uip --version

      # Without this every `uip or jobs ...` call fails and there is no evidence to
      # investigate, so unlike the review workflows this login is not optional.
      - name: UiPath Cloud login
        run: uip login --client-id env.UIPATH_CLIENT_ID --client-secret env.UIPATH_CLIENT_SECRET --authority "https://staging.uipath.com" --tenant demo

      # The skill's primary evidence is the job's execution logs, and it will not
      # confirm a root cause from design-time reading alone — without log access every
      # run would burn 80 turns and land on UNCONFIRMED. Fail here with the reason.
      # An empty log list is fine; only a failing command is fatal.
      - name: Preflight — job and logs are readable
        id: preflight
        env:
          JOB_KEY: ${{ needs.resolve.outputs.job_key }}
          FOLDER: ${{ needs.resolve.outputs.folder_path }}
        run: |
          set -euo pipefail
          if ! uip or jobs get "$JOB_KEY" --output json --output-filter '{State:State,Release:ReleaseName}' > "$RUNNER_TEMP/job.json" 2>"$RUNNER_TEMP/job.err"; then
            echo "::error::Cannot read job $JOB_KEY. Check the key is real and that the CI external app has OR.Jobs.Read."
            cat "$RUNNER_TEMP/job.err" || true
            exit 1
          fi
          cat "$RUNNER_TEMP/job.json"
          if ! uip or jobs logs "$JOB_KEY" --limit 1 --output json --output-filter '[].{Level:Level}' >/dev/null 2>"$RUNNER_TEMP/logs.err"; then
            echo "::error::Cannot read execution logs for $JOB_KEY. The investigation needs them to confirm a runtime root cause. The CI external app most likely lacks OR.Monitoring.Read."
            cat "$RUNNER_TEMP/logs.err" || true
            exit 1
          fi
          echo "Job record and execution logs are both readable."

          # The robot runs whatever version the process is pinned to, which can be far
          # behind this checkout -- reasoning about HEAD would then describe code that
          # never executed. Surface the skew so the investigation can qualify itself.
          RELEASE=$(jq -r 'if type == "object" and has("Data") then .Data else . end | .Release // ""' "$RUNNER_TEMP/job.json")
          REPO_VER=$(jq -r '.projectVersion // ""' project.json)
          uip or processes list --folder-path "$FOLDER" --output json \
            --output-filter '[].{Name:Name,Version:ProcessVersion}' \
            > "$RUNNER_TEMP/procs.json" 2>/dev/null || echo '{"Data":[]}' > "$RUNNER_TEMP/procs.json"
          RUN_VER=$(jq -r --arg n "$RELEASE" 'if type == "array" then . else (.Data // []) end | map(select(.Name == $n)) | .[0].Version // ""' "$RUNNER_TEMP/procs.json")

          {
            echo "run_version=$RUN_VER"
            echo "repo_version=$REPO_VER"
          } >> "$GITHUB_OUTPUT"

          if [ -n "$RUN_VER" ] && [ -n "$REPO_VER" ] && [ "$RUN_VER" != "$REPO_VER" ]; then
            echo "::warning::Deployed $RELEASE is $RUN_VER but this checkout is $REPO_VER — source here may not be the code that ran."
          else
            echo "Deployed version: ${RUN_VER:-unknown}; checkout: ${REPO_VER:-unknown}."
          fi

      # uip skills install --agent claude requires the claude binary on PATH.
      # claude-code-action installs its own copy, but that happens too late for this step.
      - name: Install Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      # --agent claude installs these as a plugin, not into ~/.claude/skills, so
      # listing that directory proves nothing. Without the skill the investigation
      # silently degrades into improvising, which is worse than failing here.
      - name: Install UiPath skills for Claude
        run: |
          set -euo pipefail
          uip skills install --agent claude
          SKILL_DIR=$(find ~/.claude -type d -name uipath-troubleshoot 2>/dev/null | head -1)
          if [ -z "$SKILL_DIR" ]; then
            echo "::error::uipath-troubleshoot did not install; aborting rather than guessing at the root cause."
            exit 1
          fi
          echo "Troubleshoot skill at $SKILL_DIR"

      - name: Claude investigation
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            REPO: ${{ github.repository }}
            JOB KEY: ${{ needs.resolve.outputs.job_key }}
            ORCHESTRATOR FOLDER: ${{ needs.resolve.outputs.folder_path }}
            DETECTED VIA: ${{ needs.resolve.outputs.detection }}
            FAILURE SCOPE: ${{ needs.resolve.outputs.scope }}
            FAILED QUEUE ITEM: ${{ needs.resolve.outputs.item_ref }}
            EXCEPTION TYPE: ${{ needs.resolve.outputs.exception_type }}
            DEPLOYED PROCESS VERSION: ${{ steps.preflight.outputs.run_version }}
            THIS CHECKOUT (project.json): ${{ steps.preflight.outputs.repo_version }}

            Find out why this Orchestrator job failed and write the diagnosis up.
            Do not change any workflow source in this run — a separate job applies
            the fix.

            The job may report state Successful and still be a failure: this project
            sets ShouldMarkJobAsFaulted=False. Do not treat "State: Successful" as
            proof nothing went wrong.

            FAILURE SCOPE tells you where to look, and the two are genuinely
            different failures:
            - transaction — one queue item blew up inside Process.xaml while the job
              itself completed. REFramework logs these at Error, not Fatal, and marks
              the item Failed. Start from the queue item named above (its
              ProcessingException carries the message and the faulting activity), then
              correlate to the job logs. An ApplicationException here usually means a
              defect in a C-step; a BusinessException usually means the data or a
              business rule, not the code.
            - job — the run failed before or outside any transaction, so no queue item
              exists to inspect. The job logs are the whole story.
            If the scope is unknown (someone dispatched this by hand), work out which
            it is from the evidence before concluding.

            If the two version lines above differ, the robot ran code that is NOT what
            is checked out here. Say so in the report, and treat any conclusion drawn
            from reading source as provisional until it is corroborated by runtime
            evidence.

            1. Load the uipath-troubleshoot skill and follow its protocol. It ships in
               the `uipath` plugin, so it is listed as `uipath:uipath-troubleshoot` —
               take whichever name the skills listing actually shows. The anchor is
               already given above, so skip the anchoring questions: the job key and
               the folder name are both fixed.
            2. This runner is headless — AskUserQuestion does not exist here. Wherever
               the skill's contract says to ask the user, take its documented
               no-gate path instead: record the open question in the report and
               continue on the evidence you already have. Never edit, and never
               delegate an edit to, a source artifact.
            3. Read CLAUDE.md before reading any workflow. This is a UiPath REFramework
               consumer (Portable target, VB expressions) that drains the
               NewHireBenefitsPosting queue and posts elections to the BenefitConnect
               REST API. CLAUDE.md maps every C-step to its endpoint, its exception
               code and its Process/*.xaml file — use it to turn a faulting activity
               name into the file and business rule that produced it.
            4. Write the report to job-failure-analysis.md in the repo root, in this
               exact shape:

               # Job Failure Report

               | Field | Value |
               |---|---|
               | Job key | ... |
               | Process | ... |
               | Folder | ... |
               | State | ... |
               | Started / Ended | ... |
               | Faulting activity | ... |
               | Exception | ... |
               | Transaction / queue item | ... (or "n/a") |

               ## What went wrong
               Two or three sentences, plain language, no stack trace.

               ## Root cause
               The single cause the evidence singles out, plus the workflow file and
               activity it lives in. If the evidence does not single one out, say so
               and list the surviving candidates.

               ## Evidence
               Bullet list. Each bullet cites the concrete datum it rests on — the
               command that produced it and the field — so a reviewer can re-run it.

               ## Proposed fix
               The exact change, as file plus before/after expression or property.
               If the fix is Orchestrator or tenant configuration rather than source
               (an asset value, a queue setting, a permission), give the `uip` command
               or the portal path instead and say plainly that no code change applies.

               ## Open questions
               Anything you could not settle headlessly, and what evidence would settle
               it. Write "None." if there are none.

            5. Then write exactly one word to triage-verdict.txt in the repo root.
               This word decides who acts next, so choose it on where the fix lives,
               not on how confident you feel:
               CODE_FIX    - a specific .xaml change under Process/, Rules/ or
                             Framework/ would prevent this failure
               CONFIG_FIX  - our own configuration or tenant state: an asset value, a
                             queue, a permission, Data/Config.xlsx, a job input
               EXTERNAL    - something outside this automation failed: the partner API,
                             the network, Orchestrator itself. Often transient
               UNCONFIRMED - the evidence does not support a single root cause

               Only CODE_FIX will ever put an agent near the source. If a code change
               is arguable but not clearly warranted, do not pick CODE_FIX.

            Report only what the evidence supports. If a command returns nothing, that
            is a finding — write it down rather than filling the gap with a plausible
            story.
          # Bash is broad because the skill drives the whole uip surface and captures
          # every response through tee/redirect; a narrow allowlist blocks it mid-run.
          # Edit is withheld: this workflow only ever diagnoses.
          claude_args: |
            --max-turns 80
            --allowedTools "Skill,Read,Glob,Grep,Write,Bash"

      - name: Read verdict
        id: verdict
        run: |
          set -euo pipefail
          if [ ! -f job-failure-analysis.md ]; then
            echo "::error::The investigation produced no job-failure-analysis.md."
            exit 1
          fi
          VERDICT=$(tr -d '[:space:]' < triage-verdict.txt 2>/dev/null || true)
          case "$VERDICT" in
            CODE_FIX|CONFIG_FIX|EXTERNAL|UNCONFIRMED) ;;
            # An unreadable verdict must never be the one that dispatches an agent at
            # the source, so it degrades to the inert one.
            *) echo "::warning::Unrecognized verdict '$VERDICT'; treating as UNCONFIRMED."
               VERDICT=UNCONFIRMED ;;
          esac
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
          echo "::notice::Triage verdict: $VERDICT"
          cat job-failure-analysis.md >> "$GITHUB_STEP_SUMMARY"

      # Every failure gets an issue, including CODE_FIX. The issue tracks the failure;
      # a PR is only ever one proposed remedy for it, and closing that PR unmerged must
      # not erase the record that the job failed.
      - name: File the issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERDICT: ${{ steps.verdict.outputs.verdict }}
          SHORT: ${{ needs.resolve.outputs.short_key }}
          JOB_KEY: ${{ needs.resolve.outputs.job_key }}
          # Via env, never spliced into the script body. ITEM_REF and EXC_TYPE come
          # from a queue item's Reference/ProcessingExceptionType — upstream data this
          # workflow does not control — and this step holds a write-scoped GH_TOKEN.
          FOLDER: ${{ needs.resolve.outputs.folder_path }}
          DETECTION: ${{ needs.resolve.outputs.detection }}
          SCOPE: ${{ needs.resolve.outputs.scope }}
          ITEM_REF: ${{ needs.resolve.outputs.item_ref }}
          EXC_TYPE: ${{ needs.resolve.outputs.exception_type }}
        run: |
          set -euo pipefail
          case "$VERDICT" in
            CODE_FIX)
              SUMMARY="code fix required"
              LABEL="triage:code-fix"; COLOR="d73a4a"
              NOTE=$'> [!NOTE]\n> A source change is proposed below. Dispatch the apply-fix workflow against this issue to have it attempted, or apply it by hand.' ;;
            CONFIG_FIX)
              SUMMARY="configuration fix required"
              LABEL="triage:config-fix"; COLOR="fbca04"
              NOTE=$'> [!IMPORTANT]\n> Root cause is our configuration or tenant state, not code. See "Proposed fix" for the command or portal path to run.' ;;
            EXTERNAL)
              SUMMARY="external system failure"
              LABEL="triage:external"; COLOR="0e8a16"
              NOTE=$'> [!NOTE]\n> Root cause is outside this automation. Often transient — check the upstream system, then retry the queue item. No change to this repo applies.' ;;
            *)
              SUMMARY="root cause unconfirmed"
              LABEL="triage:unconfirmed"; COLOR="cfd3d7"
              NOTE=$'> [!WARNING]\n> The evidence did not single out one root cause. See "Open questions" for what would settle it.' ;;
          esac

          # --force makes this idempotent; a labelling failure must not lose the report.
          gh label create "$LABEL" --repo "$GH_REPO" --color "$COLOR" --description "Job triage: $SUMMARY" --force >/dev/null 2>&1 || true

          {
            printf '%s\n\n' "$NOTE"
            printf '| | |\n|---|---|\n'
            printf '| Job | `%s` |\n' "$JOB_KEY"
            printf '| Folder | `%s` |\n' "$FOLDER"
            printf '| Detected via | `%s` |\n' "$DETECTION"
            printf '| Failure scope | %s |\n' "$SCOPE"
            [ -n "$ITEM_REF" ] && printf '| Failed queue item | `%s` |\n' "$ITEM_REF"
            [ -n "$EXC_TYPE" ] && printf '| Exception type | %s |\n' "$EXC_TYPE"
            printf '\n'
            cat job-failure-analysis.md
          } > "$RUNNER_TEMP/issue.md"

          # The short key in the title is what the poller's dedupe searches for.
          TITLE="job $SHORT: $SUMMARY"
          URL=$(gh issue create --repo "$GH_REPO" --title "$TITLE" --body-file "$RUNNER_TEMP/issue.md" --label "$LABEL" 2>/dev/null \
                || gh issue create --repo "$GH_REPO" --title "$TITLE" --body-file "$RUNNER_TEMP/issue.md")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "number=${URL##*/}" >> "$GITHUB_OUTPUT"
          echo "::notice::Filed $URL"

          if [ "$VERDICT" = "CODE_FIX" ]; then
            echo "::notice::To attempt the fix: gh workflow run claude-apply-fix.yml -f issue=${URL##*/}"
          fi

      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: job-failure-analysis
          path: job-failure-analysis.md

      # .local/investigations is where the skill parks the verbatim CLI responses it
      # reasoned from. It is gitignored, so this artifact is the only way to audit the
      # diagnosis after the runner is gone.
      - name: Upload raw investigation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-failure-evidence
          path: .local/investigations
          if-no-files-found: ignore
