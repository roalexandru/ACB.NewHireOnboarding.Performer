name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      UIPATH_CLIENT_ID: ${{ secrets.UIPATH_CLIENT_ID }}
      UIPATH_CLIENT_SECRET: ${{ secrets.UIPATH_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # uip rpa build / get-errors need the .NET SDK
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # https://docs.uipath.com/coding-agents/standalone/latest/user-guide/install-and-set-up
      - name: Install UiPath CLI and Claude skills
        run: |
          npm install -g @uipath/cli
          uip skills install --agent claude
          uip --version

      # Optional: enables uip commands that require UiPath Cloud auth.
      # Uses External App client credentials; skipped when the secrets are absent.
      - name: UiPath Cloud login
        if: env.UIPATH_CLIENT_ID != ''
        run: uip login --client-id env.UIPATH_CLIENT_ID --client-secret env.UIPATH_CLIENT_SECRET --authority "https://staging.uipath.com" --tenant demo

      - name: Claude Code review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. This is a UiPath Studio REFramework project (VB
            expressions, XAML workflows) — read CLAUDE.md first and hold the diff to
            its conventions.

            Steps:
            1. Run `gh pr diff ${{ github.event.pull_request.number }}` to get the changes.
            2. For every changed .xaml file run
               `uip rpa get-errors --file-path "<file>" --project-dir "."`,
               then run `uip rpa build "."` once. Report any errors they surface.
               If a uip command fails because UiPath Cloud auth is not configured,
               note it in the summary and continue with the manual review.
            3. Review the diff for project-specific defects:
               - unguarded JObject dereferences (any `obj("key")...` without a
                 `IsNot Nothing` guard)
               - raw HttpClient usage instead of Framework/HttpGet.xaml / HttpPost.xaml
               - edits to do-not-modify stock files (Main.xaml, GetTransactionData.xaml)
               - violations of BR-05 posting order or changed exception codes /
                 queue contract
               - general correctness, naming, and CLAUDE.md comment rules
            4. Post feedback:
               - Use mcp__github_inline_comment__create_inline_comment for
                 file/line-specific findings, with a concrete suggested fix.
               - Post one summary comment with `gh pr comment`: verdict first
                 (approve / needs changes), then blocking issues, then minor notes.
               - If there are blocking issues, explicitly ask the author for code
                 changes and list exactly what must change before merge.

            Only comment on genuine issues — do not pad the review with praise or
            restatements of the diff. If the PR is clean, say so in one short comment.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(uip:*)"
